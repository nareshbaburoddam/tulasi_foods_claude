server {
    listen 80;
    server_name chaats.nareshroddam.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chaats.nareshroddam.in;

    # Mounted read-only from the host's real certbot directory (see docker-compose.yml).
    # Never store private keys inside this project/repo again.
    ssl_certificate     /etc/letsencrypt/live/nareshroddam.in-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nareshroddam.in-0001/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based responses before sending
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/html;
    gzip_min_length 512;
    gzip_comp_level 5;

    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # HTML changes when you redeploy — keep this short so updates show up quickly,
        # but still let the browser skip a full re-download via ETag/If-None-Match
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location /admin {
        try_files $uri $uri/ /admin.html;
        # Never cache the admin dashboard — always fetch fresh
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API responses (orders, requests) change frequently — never cache these
        add_header Cache-Control "no-store";
    }

    location /pgadmin/ {
        proxy_pass http://pgadmin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required so pgAdmin generates correct links/assets under the /pgadmin subpath
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
        add_header Cache-Control "no-store";
    }

    # Never serve backup files, dotfiles, or version control artifacts
    location ~ (\.bkp|\.bak|\.old|~)$ {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }
}
