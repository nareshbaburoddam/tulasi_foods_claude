apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: tulasi-foods
data:
  tulasi.conf: |
    # --- Rate limiting zones ---
    # Keyed by client IP, 10MB zone holds ~160,000 tracked IPs.
    # Strict limit for order/franchise submissions: 5 requests/minute per IP.
    limit_req_zone $binary_remote_addr zone=orders_limit:10m rate=5r/m;
    # Looser general limit for everything else (browsing the site, images): 30 req/sec.
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    # Cap concurrent connections per IP too, on top of the rate limits above.
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
    # Return the semantically correct "429 Too Many Requests" instead of
    # nginx's default 503 (which implies the server itself is down).
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name chaats.nareshroddam.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name chaats.nareshroddam.in;

        # These filenames (tls.crt / tls.key) are fixed by Kubernetes —
        # that's what `kubectl create secret tls` always names them.
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /usr/share/nginx/html;
        index index.html;

        limit_conn addr_conn 20;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/html;
        gzip_min_length 512;
        gzip_comp_level 5;

        location /images/ {
            alias /usr/share/nginx/html/images/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            limit_req zone=general_limit burst=20 nodelay;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=300, must-revalidate";
        }

        location /admin {
            limit_req zone=general_limit burst=20 nodelay;
            try_files $uri $uri/ /admin.html;
            add_header Cache-Control "no-store";
        }

        # Stricter limit specifically on order/franchise submissions —
        # burst=3 allows a small legitimate retry margin, nodelay rejects
        # immediately past that instead of queueing/slowing requests down.
        location /api/orders {
            limit_req zone=orders_limit burst=3 nodelay;
            proxy_pass http://backend:8000/api/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store";
        }

        location /api/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store";
        }

        # pgAdmin isn't deployed to this cluster (yet) — that /pgadmin/ block
        # from the VM's nginx.conf is intentionally left out here. If nginx
        # can't resolve a proxy_pass upstream at startup, it fails to boot
        # entirely, so we don't reference services that don't exist yet.

        location ~ (\.bkp|\.bak|\.old|~)$ {
            deny all;
            return 404;
        }
        location ~ /\. {
            deny all;
            return 404;
        }
    }
