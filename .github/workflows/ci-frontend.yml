name: CI - Frontend (GHCR)

on:
  workflow_dispatch:
    inputs:
      major:
        description: 'Major version'
        required: true
        default: '1'
      minor:
        description: 'Minor version'
        required: true
        default: '0'
      patch:
        description: 'Patch version'
        required: true
        default: '0'
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tulasi-frontend
  VERSION: "${{ github.event.inputs.major }}.${{ github.event.inputs.minor }}.${{ github.event.inputs.patch }}.${{ github.run_number }}"

permissions:
  contents: write
  packages: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Select values file
        run: |
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "MANIFEST_PATH=helm/tulasi-foods/values-prod.yaml" >> $GITHUB_ENV
          else
            echo "MANIFEST_PATH=helm/tulasi-foods/values-dev.yaml" >> $GITHUB_ENV
          fi
          echo "Using: $MANIFEST_PATH"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update frontend image tag in values.yaml
        run: |
          yq -i '.frontend.image.tag = env(VERSION)' "${MANIFEST_PATH}"

          echo "Updated frontend image:"
          yq '.frontend.image' "${MANIFEST_PATH}"

      - name: Commit and push values.yaml change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${MANIFEST_PATH}"

          git diff --staged --quiet && echo "No changes to commit" && exit 0

          git commit -m "ci: update frontend image to ${VERSION} [skip ci]"

          git push origin HEAD:${GITHUB_REF_NAME}
