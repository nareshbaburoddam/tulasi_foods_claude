apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tulasi-ingress
  namespace: tulasi-foods
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - chaats.nareshroddam.in
      secretName: tulasi-tls
  rules:
    - host: chaats.nareshroddam.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
