apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: tulasi-foods
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: nginx
          image: ghcr.io/nareshbaburoddam/tulasi-frontend:1.0.0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/tulasi.conf
              subPath: tulasi.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: tulasi-foods
spec:
  # No "type:" specified -> defaults to ClusterIP now. The Azure App Routing
  # Ingress is the only thing exposed to the internet; this Service is only
  # reachable from inside the cluster (by the Ingress Controller itself).
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
