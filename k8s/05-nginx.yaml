apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: tulasi-foods
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: nginx
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: ghcr.io/nareshbaburoddam/tulasi-frontend:1.0.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/tulasi.conf
              subPath: tulasi.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: tulasi-foods
spec:
  # No "type:" specified -> defaults to ClusterIP now. The Azure App Routing
  # Ingress is the only thing exposed to the internet; this Service is only
  # reachable from inside the cluster (by the Ingress Controller itself).
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
