apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tulasi-foods
spec:
  # No "replicas:" here on purpose -- backend-hpa now owns this field.
  # If we kept replicas:2 in git, ArgoCD's selfHeal would keep fighting
  # HPA's scaling decisions every time it synced.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: tulasi-backend-sa
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Actively prefer spreading the 2 replicas across different nodes,
      # so losing one node doesn't take down both backend pods at once.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: backend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: ghcr.io/nareshbaburoddam/tulasi-backend:1.2.0.7
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "50m"
              memory: "68Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: POSTGRES_HOST
            # References the vars above via $(VAR) — same idea as string
            # interpolation, resolved by Kubernetes before the container starts.
            # sslmode=require -- Azure Database for PostgreSQL mandates SSL.
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)?sslmode=require"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: SECRET_KEY
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: ADMIN_PASSWORD
            - name: ALLOWED_ORIGIN
              value: "https://chaats.nareshroddam.in"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/kv-secrets
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tulasi-kv-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tulasi-foods
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  # ClusterIP — internal only, reached by nginx via the service name "backend",
  # exactly like your old docker-compose network did it.
