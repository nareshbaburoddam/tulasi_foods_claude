apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tulasi-foods
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nareshbaburoddam/tulasi_foods_claude.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: tulasi-foods

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
