  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  strategy:
    maxSurge: 0
    maxUnavailable: 1
ingress:
  host: chaats.nareshroddam.in
  tlsSecret: tulasi-tls
workloadIdentity:
  clientId: "d2fb4f8b-d0a2-44b8-a0f4-449448c25075"
azure:
  keyVaultName: "tulasi-kv-2026"
