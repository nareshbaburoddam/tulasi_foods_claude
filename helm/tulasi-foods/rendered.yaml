apiVersion: v1
kind: ServiceAccount
metadata:
  name: tulasi-backend-sa
  namespace: tulasi-foods
  annotations:
    azure.workload.identity/client-id: "d2fb4f8b-d0a2-44b8-a0f4-449448c25075"
