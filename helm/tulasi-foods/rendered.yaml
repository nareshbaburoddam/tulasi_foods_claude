# Source: tulasi-foods/templates/secretproviderclass.yaml
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tulasi-kv-secrets
  namespace: tulasi-foods
spec:
  provider: azure
  parameters:
    clientID: "d2fb4f8b-d0a2-44b8-a0f4-449448c25075"  # same clientId from setup-workload-identity.sh
    keyvaultName: "tulasi-kv-2026"
    tenantId: "e41f5746-929e-4d11-a6ab-d553e45ed8c3"
    objects: |
      array:
        - |
          objectName: POSTGRES-USER
          objectType: secret
        - |
          objectName: POSTGRES-HOST
          objectType: secret
        - |
          objectName: POSTGRES-PASSWORD
          objectType: secret
        - |
          objectName: POSTGRES-DB
          objectType: secret
        - |
          objectName: APPLICATIONINSIGHTS-CONNECTION-STRING
          objectType: secret
        - |
          objectName: SECRET-KEY
          objectType: secret
        - |
          objectName: ADMIN-USERNAME
          objectType: secret
        - |
          objectName: ADMIN-PASSWORD
          objectType: secret
        - |
          objectName: ALLOWED-ORIGIN
          objectType: secret
        - |
          objectName: TEST-DUMMY-VALUE
          objectType: secret
        - |
          objectName: OTEL-SERVICE-NAME
          objectType: secret
  # This is the key part: syncing the mounted Key Vault values into a NATIVE
  # Kubernetes Secret with the SAME NAME your Deployments already reference
  # (tulasi-secrets) — so backend/postgres YAML needs zero changes.
  secretObjects:
    - secretName: tulasi-secrets
      type: Opaque
      data:
        - objectName: POSTGRES-USER
          key: POSTGRES_USER
        - objectName: POSTGRES-HOST
          key: POSTGRES_HOST
        - objectName: APPLICATIONINSIGHTS-CONNECTION-STRING
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: POSTGRES-PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: POSTGRES-DB
          key: POSTGRES_DB
        - objectName: SECRET-KEY
          key: SECRET_KEY
        - objectName: ADMIN-USERNAME
          key: ADMIN_USERNAME
        - objectName: ADMIN-PASSWORD
          key: ADMIN_PASSWORD
        - objectName: ALLOWED-ORIGIN
          key: ALLOWED_ORIGIN
        - objectName: TEST-DUMMY-VALUE
          key: TEST_DUMMY_VALUE
        - objectName: OTEL-SERVICE-NAME
          key: OTEL_SERVICE_NAME
