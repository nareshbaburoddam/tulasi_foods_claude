apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tulasi-secrets
  namespace: tulasi

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore

  target:
    name: tulasi-secrets

  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: POSTGRES_USER-dev

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: POSTGRES_PASSWORD-dev

    - secretKey: POSTGRES_DB
      remoteRef:
        key: POSTGRES_DB-dev

    - secretKey: POSTGRES_HOST
      remoteRef:
        key: POSTGRES_HOST-dev

    - secretKey: SECRET_KEY
      remoteRef:
        key: SECRET_KEY-dev

    - secretKey: ADMIN_USERNAME
      remoteRef:
        key: ADMIN_USERNAME-dev

    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: ADMIN_PASSWORD-dev
    - secretKey: TEST_SECRET_ENV
      remoteRef:
        key: TEST_SECRET_ENV
