apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-{{ .Values.color }}
  namespace: {{ .Values.namespace }}

spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.backend.strategy.maxSurge }}
      maxUnavailable: {{ .Values.backend.strategy.maxUnavailable }}

  selector:
    matchLabels:
      app: backend
      version: {{ .Values.color }}

  template:
    metadata:
      labels:
        app: backend
        version: {{ .Values.color }}

    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}

      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend

      containers:
        - name: backend

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

          ports:
            - containerPort: 8000

          resources:
{{- toYaml .Values.backend.resources | nindent 12 }}

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: POSTGRES_DB

            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: POSTGRES_HOST

            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: SECRET_KEY

            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: ADMIN_USERNAME

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: ADMIN_PASSWORD

            - name: TEST_SECRET_ENV
              valueFrom:
                secretKeyRef:
                  name: tulasi-secrets
                  key: TEST_SECRET_ENV

            - name: ALLOWED_ORIGIN
              value: "{{ .Values.allowedOrigin }}"

            - name: APP_UPLOAD_DIR
              value: {{ .Values.persistence.mountPath | quote }}

          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.persistence.mountPath | quote }}

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-{{ .Values.color }}-uploads
